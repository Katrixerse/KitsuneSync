services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kitsune
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kitsune}
      POSTGRES_DB: kitsunesync
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      # Published on localhost only, so `npm run dev` on the host can use it.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitsune -d kitsunesync"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://kitsune:${POSTGRES_PASSWORD:-kitsune}@db:5432/kitsunesync
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
